<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Новый пароль — Quizik</title><link rel="stylesheet" href="style.css">
</head>
<body class="adminbody">
<header><a class="logo" href="/">QUIZ<span>IK</span></a></header>
<main class="adminwrap"><section class="panel login">
<h1>Новый пароль</h1><p>Придумай новый пароль для админки Quizik.</p>
<input id="password1" type="password" placeholder="Новый пароль">
<input id="password2" type="password" placeholder="Повтори пароль">
<button id="saveBtn" class="btn">Сохранить новый пароль</button><p id="msg" class="msg"></p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db=supabase.createClient(QUIZIK.url,QUIZIK.key),msg=document.querySelector('#msg');
document.querySelector('#saveBtn').onclick=async()=>{
 const p1=document.querySelector('#password1').value,p2=document.querySelector('#password2').value;
 if(p1.length<6){msg.textContent='Пароль должен содержать минимум 6 символов.';return}
 if(p1!==p2){msg.textContent='Пароли не совпадают.';return}
 msg.textContent='Сохраняем…';
 const {error}=await db.auth.updateUser({password:p1});
 if(error){msg.textContent='Ссылка восстановления недействительна или истекла. Запроси новое письмо.';return}
 msg.textContent='Пароль изменён. Сейчас откроется админка…';
 setTimeout(()=>location.href='admin.html',1200);
};
</script></body></html>
