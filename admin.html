<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quizik Admin</title><link rel="stylesheet" href="style.css"></head><body class="adminbody"><header><a class="logo" href="/">QUIZ<span>IK</span> <small>ADMIN</small></a><button id="logout" class="ghost hidden">Выйти</button></header><main class="adminwrap"><section id="login" class="panel login"><h1>Вход в админку</h1><p>Используй аккаунт администратора, созданный в Supabase.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button id="loginBtn" class="btn">Войти</button><p id="loginMsg" class="msg"></p></section><div id="dashboard" class="hidden"><div class="adminhead"><div><small>УПРАВЛЕНИЕ КОНТЕНТОМ</small><h1>Тесты Quizik</h1></div><button id="newBtn" class="btn">+ Новый тест</button></div><section id="editor" class="panel hidden"><h2>Новый тест</h2><div class="formgrid"><label>Название<input id="title" placeholder="Например: Угадай фильм по кадру"></label><label>Slug<input id="slug" placeholder="guess-movie"></label><label class="wide">Описание<textarea id="desc" placeholder="Короткое описание"></textarea></label><label>Категория<select id="category"></select></label><label>Обложка<input id="cover" type="file" accept="image/*"></label></div><div class="switchrow"><label><input id="published" type="checkbox"> Опубликовать сразу</label></div><hr><div class="adminhead"><h2>Вопросы</h2><button id="addQuestion" class="ghost">+ Добавить вопрос</button></div><div id="questions"></div><button id="saveQuiz" class="btn">Сохранить тест</button><p id="saveMsg" class="msg"></p></section><section class="panel"><h2>Созданные тесты</h2><div id="quizList">Загрузка…</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
